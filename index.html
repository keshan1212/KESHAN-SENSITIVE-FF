<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KESHAN SENSITIVE FF</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Live Lightning Canvas Background -->
    <canvas id="lightningCanvas"></canvas>

    <div class="app-container">
        <!-- Hacker Logo Section -->
        <div class="logo-wrapper">
            <div class="hacker-logo">
                <svg viewBox="0 0 100 100" class="logo-svg">
                    <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#050505" stroke="#00ffcc" stroke-width="3"/>
                    <path d="M 30,35 Q 50,15 70,35 L 80,65 L 20,65 Z" fill="#000" stroke="#00ffcc" stroke-width="2"/>
                    <circle cx="40" cy="45" r="4" fill="#ff0055" class="eye-glow"/>
                    <circle cx="60" cy="45" r="4" fill="#ff0055" class="eye-glow"/>
                    <path d="M 35,55 Q 50,65 65,55" fill="none" stroke="#00ffcc" stroke-width="2"/>
                </svg>
            </div>
            <h1 class="glitch-text" data-text="KESHAN SENSITIVE FF">KESHAN SENSITIVE FF</h1>
            <p class="subtitle">VIP AUTO HEADSHOT & SENSITIVITY GENERATOR</p>
        </div>

        <!-- Search Box -->
        <div class="search-box">
            <input type="text" id="phoneInput" placeholder="Enter Your Phone Model (e.g. Samsung A12, Redmi Note 10)...">
            <button onclick="getSensitivity()">SEARCH SENSITIVITY</button>
        </div>

        <!-- Output Result Section -->
        <div id="resultContainer" class="result-card hidden">
            <h2 id="deviceTitle">MODEL: -</h2>
            
            <div class="sens-grid">
                <div class="sens-item"><span>General</span><strong id="genVal">0</strong></div>
                <div class="sens-item"><span>Red Dot</span><strong id="redVal">0</strong></div>
                <div class="sens-item"><span>2x Scope</span><strong id="scope2Val">0</strong></div>
                <div class="sens-item"><span>4x Scope</span><strong id="scope4Val">0</strong></div>
                <div class="sens-item"><span>Sniper Scope</span><strong id="sniperVal">0</strong></div>
                <div class="sens-item"><span>Free Look</span><strong id="freeVal">0</strong></div>
            </div>

            <div class="settings-box">
                <h3>RECOMMENDED PHONE SETTINGS</h3>
                <p><strong>DPI:</strong> <span id="dpiVal">-</span></p>
                <p><strong>Fire Button Size:</strong> <span id="btnVal">-</span></p>
                <p><strong>Pointer Speed:</strong> <span id="ptrVal">Maximum (100%)</span></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
  </html>
